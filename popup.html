<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>薯页摘录</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="shell">
      <header class="masthead">
        <div class="brand-mark" aria-hidden="true">摘</div>
        <div>
          <p class="eyebrow">LOCAL NOTE CLIPPER</p>
          <h1>薯页摘录</h1>
        </div>
        <span class="version">v0.1</span>
      </header>

      <section class="brief" aria-labelledby="brief-title">
        <div class="brief-heading">
          <h2 id="brief-title">当前帖文</h2>
          <span class="limit-stamp">前 50 条</span>
        </div>
        <p>元信息、互动数据、一级评论与帖文图片，仅保存在本机。</p>
      </section>

      <section class="options" aria-label="导出选项">
        <label class="option-row">
          <span>
            <strong>保存帖文图片</strong>
            <small>自动排除头像和评论表情</small>
          </span>
          <input id="download-images" type="checkbox" checked>
          <span class="toggle" aria-hidden="true"></span>
        </label>
        <label class="option-row">
          <span>
            <strong>附带已显示回复</strong>
            <small>不会主动展开全部楼中楼</small>
          </span>
          <input id="include-visible-replies" type="checkbox" checked>
          <span class="toggle" aria-hidden="true"></span>
        </label>
      </section>

      <section id="status-card" class="status-card" aria-live="polite">
        <div class="status-topline">
          <span id="status-dot" class="status-dot"></span>
          <strong id="status-title">准备就绪</strong>
          <span id="status-count">0 / 50</span>
        </div>
        <div class="progress-track" aria-hidden="true">
          <span id="progress-bar"></span>
        </div>
        <p id="status-detail">请先打开一个小红书帖文详情页。</p>
      </section>

      <button id="extract-button" class="extract-button" type="button">
        <span class="button-label">开始摘录</span>
        <span class="button-arrow" aria-hidden="true">↘</span>
      </button>

      <footer>
        <span>JSON · Markdown · CSV · Images</span>
        <span>不读取 Cookie</span>
      </footer>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
